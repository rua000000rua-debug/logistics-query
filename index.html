<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物流查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .logo {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .logo h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        .logo p {
            opacity: 0.9;
        }
        .search-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .search-box input {
            flex: 1;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
        }
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        .search-box button {
            padding: 14px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        .result-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            display: none;
        }
        .tracking-number {
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 16px;
        }
        .timeline {
            position: relative;
            padding-left: 30px;
        }
        .timeline-item {
            position: relative;
            padding-bottom: 20px;
            border-left: 2px solid #e2e8f0;
            margin-left: 10px;
            padding-left: 20px;
        }
        .timeline-item:last-child {
            border-left: 2px solid transparent;
        }
        .timeline-dot {
            position: absolute;
            left: -33px;
            top: 0;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #cbd5e0;
        }
        .timeline-item:first-child .timeline-dot {
            background: #48bb78;
            box-shadow: 0 0 0 3px rgba(72,187,120,0.2);
        }
        .timeline-date {
            font-size: 12px;
            color: #718096;
            margin-bottom: 4px;
        }
        .timeline-content {
            color: #2d3748;
            line-height: 1.5;
        }
        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            font-size: 12px;
            opacity: 0.8;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>📦 物流查询系统</h1>
        <p>请输入您的运单号查询物流信息</p>
    </div>

    <div class="search-card">
        <div class="search-box">
            <input type="text" id="trackingInput" placeholder="请输入运单号" autocomplete="off" />
            <button onclick="searchTracking()">查询</button>
        </div>
        <div style="font-size: 12px; color: #718096; text-align: center;">
            支持单号：PXU012605124-1 和 PXM1002605152-1
        </div>
    </div>

    <div id="result" class="result-card"></div>
    <footer>如有疑问请联系客服</footer>
</div>

<script>
    // ============================================================
    // 物流数据库 - 直接在这里添加或修改运单信息
    // ============================================================
    var logisticsDatabase = {};

    // 单号1：PXU012605124-1
    logisticsDatabase["PXU012605124-1"] = [
        "2026-05-28 10:01:58 【运输中】 口岸已换装",
        "2026-05-25 10:01:54 【抵达口岸】 货物已经到达出境口岸",
        "2026-05-18 22:02:07 【国内出运】 货物已装载完毕，已发车去出境口岸",
        "2026-05-18 10:11:19 货物装载完毕，货物已从仓库发出",
        "2026-05-18 09:52:48 订单已创建"
    ];

    // 单号2：PXM1002605152-1
    logisticsDatabase["PXM1002605152-1"] = [
        "2026-05-27 10:01:53 货物已换装完成",
        "2026-05-26 10:01:40 货物抵达口岸，等待过境车换装",
        "2026-05-19 15:02:10 货物装载完毕，货物已从仓库发出",
        "2026-05-19 10:23:13 货物装载完毕，货物已从仓库发出",
        "2026-05-19 10:05:46 订单已创建"
    ];

    // ============================================================

    function searchTracking() {
        // 获取输入的单号
        var inputElement = document.getElementById('trackingInput');
        var trackingNumber = inputElement.value.trim();
        var resultDiv = document.getElementById('result');

        // 检查是否输入了单号
        if (trackingNumber === "") {
            resultDiv.style.display = "block";
            resultDiv.innerHTML = '<div class="error-message">⚠️ 请输入运单号</div>';
            return;
        }

        // 显示加载中
        resultDiv.style.display = "block";
        resultDiv.innerHTML = '<div class="loading">🔍 查询中，请稍候...</div>';

        // 延迟一下再查询（让用户体验更好）
        setTimeout(function() {
            // 查找物流信息
            var logistics = logisticsDatabase[trackingNumber];

            if (logistics && logistics.length > 0) {
                // 构建时间轴HTML（从最新到最旧）
                var timelineHtml = '<div class="timeline">';
                
                // 倒序显示（最新的在上面）
                for (var i = logistics.length - 1; i >= 0; i--) {
                    var item = logistics[i];
                    var time = "";
                    var content = item;
                    
                    // 提取时间部分（格式：2026-05-28 10:01:58）
                    var timeMatch = item.match(/^(\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2})/);
                    if (timeMatch) {
                        time = timeMatch[1];
                        content = item.substring(timeMatch[0].length).trim();
                    }
                    
                    timelineHtml += '<div class="timeline-item">';
                    timelineHtml += '<div class="timeline-dot"></div>';
                    if (time) {
                        timelineHtml += '<div class="timeline-date">' + time + '</div>';
                    }
                    timelineHtml += '<div class="timeline-content">' + content + '</div>';
                    timelineHtml += '</div>';
                }
                timelineHtml += '</div>';
                
                // 显示结果
                resultDiv.innerHTML = '<div class="tracking-number">🔍 运单号：' + trackingNumber + '</div>' + timelineHtml;
            } else {
                // 未找到单号
                resultDiv.innerHTML = '<div class="error-message">❌ 未找到运单号 ' + trackingNumber + ' 的信息<br/><br/>请确认单号是否正确，或联系发货方</div>';
            }
        }, 100);
    }

    // 支持回车键查询
    document.getElementById('trackingInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            searchTracking();
        }
    });
</script>
</body>
</html>
