<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>物流查询测试</title>
    <style>
        body { font-family: Arial; padding: 40px; text-align: center; }
        input, button { padding: 10px; font-size: 16px; }
        input { width: 250px; }
        .result { margin-top: 30px; padding: 20px; background: #f5f5f5; border-radius: 8px; text-align: left; display: none; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h2>📦 物流查询测试</h2>
    <p>测试单号：<strong>TEST123</strong></p>
    <input type="text" id="trackingNumber" placeholder="请输入单号" />
    <button onclick="search()">查询</button>
    <div id="result" class="result"></div>

    <script>
        // 最简单的测试数据
        var testData = {
            "TEST123": ["2026-06-01 揽收", "2026-06-02 运输中", "2026-06-03 派送中"]
        };

        function search() {
            var number = document.getElementById('trackingNumber').value.trim();
            var resultDiv = document.getElementById('result');
            var data = testData[number];

            resultDiv.style.display = "block";

            if (data) {
                var html = '<p class="success">✅ 查询成功！单号：' + number + '</p><ul>';
                for (var i = 0; i < data.length; i++) {
                    html += '<li>' + data[i] + '</li>';
                }
                html += '</ul>';
                resultDiv.innerHTML = html;
            } else {
                resultDiv.innerHTML = '<p class="error">❌ 未找到单号：' + number + '</p><p>请尝试输入：TEST123</p>';
            }
        }
    </script>
</body>
</html>
